openapi: 3.1.0
info:
  contact: {}
  description: ""
  title: Maytes API
  version: 1.0.0
servers:
- url: /
paths:
  /api/health:
    get:
      operationId: getHealth
      parameters: []
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthResponse"
          description: ""
      summary: Health check
      tags:
      - Default
  /oauth/token:
    post:
      operationId: getOAuthToken
      parameters: []
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/OAuthTokenRequest"
        required: true
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OAuthTokenResponse"
          description: ""
        "400":
          description: Invalid grant or request
        "401":
          description: Unauthorized
      summary: Issue an access token
      tags:
      - Default
  /api/merchant/v1/checkouts:
    post:
      operationId: createCheckout
      parameters: []
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateCheckoutRequest"
        required: true
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CreateCheckoutResponse"
          description: ""
        "401":
          content:
            application/json:
              examples:
                unauthorized:
                  summary: Unauthorized
                  value:
                    message: Unauthorized
                    error: Unauthorized
                    code: unauthorized
              schema:
                $ref: "#/components/schemas/createCheckout_401_response"
          description: ""
        "409":
          content:
            application/json:
              examples:
                order_already_authorized:
                  summary: Order already authorized
                  value:
                    message: Order already authorized
                    error: Conflict
                    code: order_already_authorized
                merchant_not_accepting_checkouts:
                  summary: The merchant is paused or deactivated and is not accepting
                    new checkouts
                  value:
                    message: The merchant is paused or deactivated and is not accepting
                      new checkouts
                    error: Conflict
                    code: merchant_not_accepting_checkouts
              schema:
                $ref: "#/components/schemas/createCheckout_409_response"
          description: ""
        "422":
          content:
            application/json:
              examples:
                invalid_amount:
                  summary: Invalid amount or amount arithmetic error
                  value:
                    message: Invalid amount or amount arithmetic error
                    error: Unprocessable Entity
                    code: invalid_amount
                amount_below_minimum:
                  summary: Amount is below the minimum chargeable amount for its currency
                  value:
                    message: Amount is below the minimum chargeable amount for its
                      currency
                    error: Unprocessable Entity
                    code: amount_below_minimum
                invalid_amount_arithmetic:
                  summary: Amount arithmetic mismatch
                  value:
                    message: Amount arithmetic mismatch
                    error: Unprocessable Entity
                    code: invalid_amount_arithmetic
                currency_not_supported:
                  summary: The platform does not support checkouts in this currency
                  value:
                    message: The platform does not support checkouts in this currency
                    error: Unprocessable Entity
                    code: currency_not_supported
                merchant_currency_mismatch:
                  summary: The checkout's currency does not match the merchant's configured
                    currency
                  value:
                    message: The checkout's currency does not match the merchant's
                      configured currency
                    error: Unprocessable Entity
                    code: merchant_currency_mismatch
                merchant_not_configured:
                  summary: This merchant has not been configured for payments
                  value:
                    message: This merchant has not been configured for payments
                    error: Unprocessable Entity
                    code: merchant_not_configured
              schema:
                $ref: "#/components/schemas/createCheckout_422_response"
          description: ""
      security:
      - bearer: []
      summary: Create a new checkout
      tags:
      - Default
  /api/merchant/v1/checkouts/{checkoutUuid}:
    get:
      operationId: getCheckout
      parameters:
      - explode: false
        in: path
        name: checkoutUuid
        required: true
        schema:
          type: string
        style: simple
      - explode: true
        in: query
        name: merchant_order_id
        required: false
        schema:
          type: string
        style: form
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GetCheckoutResponse"
          description: ""
        "401":
          content:
            application/json:
              examples:
                unauthorized:
                  summary: Unauthorized
                  value:
                    message: Unauthorized
                    error: Unauthorized
                    code: unauthorized
              schema:
                $ref: "#/components/schemas/createCheckout_401_response"
          description: ""
        "404":
          content:
            application/json:
              examples:
                not_found:
                  summary: Checkout not found
                  value:
                    message: Checkout not found
                    error: Not Found
                    code: not_found
              schema:
                $ref: "#/components/schemas/getCheckout_404_response"
          description: ""
        "422":
          content:
            application/json:
              examples:
                order_mismatch:
                  summary: Order ID does not match
                  value:
                    message: Order ID does not match
                    error: Unprocessable Entity
                    code: order_mismatch
              schema:
                $ref: "#/components/schemas/getCheckout_422_response"
          description: ""
      security:
      - bearer: []
      summary: Get checkout details
      tags:
      - Default
  /api/merchant/v1/checkouts/{checkoutUuid}/capture:
    post:
      operationId: captureCheckout
      parameters:
      - explode: false
        in: path
        name: checkoutUuid
        required: true
        schema:
          type: string
        style: simple
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CaptureCheckoutRequest"
        required: true
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CaptureCheckoutResponse"
          description: ""
        "401":
          content:
            application/json:
              examples:
                unauthorized:
                  summary: Unauthorized
                  value:
                    message: Unauthorized
                    error: Unauthorized
                    code: unauthorized
              schema:
                $ref: "#/components/schemas/createCheckout_401_response"
          description: ""
        "404":
          content:
            application/json:
              examples:
                not_found:
                  summary: Checkout not found
                  value:
                    message: Checkout not found
                    error: Not Found
                    code: not_found
              schema:
                $ref: "#/components/schemas/getCheckout_404_response"
          description: ""
        "409":
          content:
            application/json:
              examples:
                not_capturable:
                  summary: Checkout not capturable
                  value:
                    message: Checkout not capturable
                    error: Conflict
                    code: not_capturable
              schema:
                $ref: "#/components/schemas/captureCheckout_409_response"
          description: ""
        "422":
          content:
            application/json:
              examples:
                order_mismatch:
                  summary: Order ID does not match
                  value:
                    message: Order ID does not match
                    error: Unprocessable Entity
                    code: order_mismatch
                amount_mismatch:
                  summary: Total amount does not match
                  value:
                    message: Total amount does not match
                    error: Unprocessable Entity
                    code: amount_mismatch
                currency_mismatch:
                  summary: Currency does not match
                  value:
                    message: Currency does not match
                    error: Unprocessable Entity
                    code: currency_mismatch
                no_active_session:
                  summary: No active session found
                  value:
                    message: No active session found
                    error: Unprocessable Entity
                    code: no_active_session
              schema:
                $ref: "#/components/schemas/captureCheckout_422_response"
          description: ""
      security:
      - bearer: []
      summary: Capture authorized checkout
      tags:
      - Default
  /api/merchant/v1/checkouts/{checkoutUuid}/cancel:
    post:
      operationId: cancelCheckout
      parameters:
      - explode: false
        in: path
        name: checkoutUuid
        required: true
        schema:
          type: string
        style: simple
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CancelCheckoutRequest"
        required: true
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CancelCheckoutResponse"
          description: ""
        "401":
          content:
            application/json:
              examples:
                unauthorized:
                  summary: Unauthorized
                  value:
                    message: Unauthorized
                    error: Unauthorized
                    code: unauthorized
              schema:
                $ref: "#/components/schemas/createCheckout_401_response"
          description: ""
        "404":
          content:
            application/json:
              examples:
                not_found:
                  summary: Checkout not found
                  value:
                    message: Checkout not found
                    error: Not Found
                    code: not_found
              schema:
                $ref: "#/components/schemas/getCheckout_404_response"
          description: ""
        "409":
          content:
            application/json:
              examples:
                session_not_voidable:
                  summary: "Cannot void session: a payment is in a non-voidable state"
                  value:
                    message: "Cannot void session: a payment is in a non-voidable\
                      \ state"
                    error: Conflict
                    code: session_not_voidable
              schema:
                $ref: "#/components/schemas/cancelCheckout_409_response"
          description: ""
        "422":
          content:
            application/json:
              examples:
                order_mismatch:
                  summary: Order ID does not match
                  value:
                    message: Order ID does not match
                    error: Unprocessable Entity
                    code: order_mismatch
              schema:
                $ref: "#/components/schemas/getCheckout_422_response"
          description: ""
      security:
      - bearer: []
      summary: Cancel authorized checkout
      tags:
      - Default
  /api/merchant/v1/checkouts/{checkoutUuid}/refund:
    post:
      description: Initiates a full refund of the captured payment. Returns 204 immediately;
        Stripe confirms asynchronously via webhook. Poll GET /checkouts/:uuid for
        status and refund details.
      operationId: refundCheckout
      parameters:
      - explode: false
        in: path
        name: checkoutUuid
        required: true
        schema:
          type: string
        style: simple
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateRefundRequest"
        required: true
      responses:
        "204":
          description: ""
        "401":
          content:
            application/json:
              examples:
                unauthorized:
                  summary: Unauthorized
                  value:
                    message: Unauthorized
                    error: Unauthorized
                    code: unauthorized
              schema:
                $ref: "#/components/schemas/createCheckout_401_response"
          description: ""
        "402":
          content:
            application/json:
              examples:
                refund_insufficient_funds:
                  summary: Insufficient platform funds to process the refund; try
                    again once funds are available
                  value:
                    message: Insufficient platform funds to process the refund; try
                      again once funds are available
                    code: refund_insufficient_funds
              schema:
                $ref: "#/components/schemas/refundCheckout_402_response"
          description: ""
        "404":
          content:
            application/json:
              examples:
                not_found:
                  summary: Checkout not found
                  value:
                    message: Checkout not found
                    error: Not Found
                    code: not_found
              schema:
                $ref: "#/components/schemas/getCheckout_404_response"
          description: ""
        "409":
          content:
            application/json:
              examples:
                not_refundable:
                  summary: Checkout is not in a refundable state
                  value:
                    message: Checkout is not in a refundable state
                    error: Conflict
                    code: not_refundable
              schema:
                $ref: "#/components/schemas/refundCheckout_409_response"
          description: ""
      security:
      - bearer: []
      summary: Refund a captured checkout
      tags:
      - Default
  /api/merchant/v1/settlements:
    get:
      description: "Returns settlements for the authenticated merchant. Default sort:\
        \ created_at ASC."
      operationId: listSettlements
      parameters:
      - description: Pagination offset (default 0)
        explode: true
        in: query
        name: offset
        required: false
        schema: {}
        style: form
      - description: "Max records to return (default 50, max 200)"
        explode: true
        in: query
        name: limit
        required: false
        schema: {}
        style: form
      - description: "Sort direction (default: asc)"
        explode: true
        in: query
        name: sort_dir
        required: false
        schema:
          enum:
          - asc
          - desc
          type: string
        style: form
      - description: "Field to sort by (default: created_at)"
        explode: true
        in: query
        name: sort_by
        required: false
        schema:
          enum:
          - created_at
          - period_to
          - settled_amount
          type: string
        style: form
      - description: Include settlements created at or before this ISO-8601 timestamp
        explode: true
        in: query
        name: created_before
        required: false
        schema: {}
        style: form
      - description: Include settlements created at or after this ISO-8601 timestamp
        explode: true
        in: query
        name: created_after
        required: false
        schema: {}
        style: form
      - description: Filter by status
        explode: true
        in: query
        name: status
        required: false
        schema:
          enum:
          - CREATED
          - PENDING
          - COMPLETED
          - FAILED
          - NEEDS_REVIEW
          - CANCELLED
          type: string
        style: form
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ListSettlementsResponse"
          description: ""
        "401":
          content:
            application/json:
              examples:
                unauthorized:
                  summary: Unauthorized
                  value:
                    message: Unauthorized
                    error: Unauthorized
                    code: unauthorized
              schema:
                $ref: "#/components/schemas/createCheckout_401_response"
          description: ""
      security:
      - bearer: []
      summary: List settlements for this merchant
      tags:
      - Default
  /api/merchant/v1/settlements/{uuid}:
    get:
      operationId: getSettlement
      parameters:
      - description: Settlement UUID
        explode: false
        in: path
        name: uuid
        required: true
        schema:
          type: string
        style: simple
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GetSettlementResponse"
          description: ""
        "401":
          content:
            application/json:
              examples:
                unauthorized:
                  summary: Unauthorized
                  value:
                    message: Unauthorized
                    error: Unauthorized
                    code: unauthorized
              schema:
                $ref: "#/components/schemas/createCheckout_401_response"
          description: ""
        "404":
          content:
            application/json:
              examples:
                not_found:
                  summary: Settlement not found
                  value:
                    message: Settlement not found
                    error: Not Found
                    code: not_found
              schema:
                $ref: "#/components/schemas/getCheckout_404_response"
          description: ""
      security:
      - bearer: []
      summary: Get a settlement by UUID
      tags:
      - Default
components:
  schemas:
    HealthResponse:
      example:
        status: ok
      properties:
        status:
          example: ok
          type: string
      required:
      - status
      id: HealthResponse
    ErrorResponseDto:
      properties:
        message:
          type: string
        error:
          type: string
        code:
          type: string
        metadata:
          additionalProperties: {}
      required:
      - code
      - error
      - message
    OAuthTokenRequest:
      example:
        refresh_token: refresh_token
        password: password
        grant_type: grant_type
        scope: scope
        client_secret: client_secret
        client_id: 046b6c7f-0b8a-43b9-b35d-6489e6daee91
        username: username
      properties:
        grant_type:
          minLength: 1
          type: string
        client_id:
          format: uuid
          type: string
        client_secret:
          type: string
        username:
          type: string
        password:
          type: string
        refresh_token:
          type: string
        scope:
          type: string
      required:
      - client_id
      - grant_type
      id: OAuthTokenRequest
    OAuthTokenResponse:
      example:
        access_token: access_token
        refresh_token: refresh_token
        scope: scope
        token_type: token_type
        expires_in: 0.8008281904610115
      properties:
        access_token:
          type: string
        refresh_token:
          type: string
        expires_in:
          type: number
        token_type:
          type: string
        scope:
          type: string
      required:
      - access_token
      - expires_in
      - scope
      - token_type
      id: OAuthTokenResponse
    Fee:
      example:
        gross: 0
        breakdown:
        - amount: 5
          id: id
          label: label
          type: rate_card
        - amount: 5
          id: id
          label: label
          type: rate_card
        discount: 0
        net: 0
      properties:
        gross:
          minimum: 0
          type: integer
        discount:
          minimum: 0
          type: integer
        net:
          minimum: 0
          type: integer
        breakdown:
          items:
            $ref: "#/components/schemas/FeeBreakdownLine"
          type: array
      required:
      - breakdown
      - discount
      - gross
      - net
      title: Fee
      id: Fee
    FeeBreakdownLine:
      example:
        amount: 5
        id: id
        label: label
        type: rate_card
      properties:
        type:
          enum:
          - rate_card
          - promotion
          type: string
        id:
          type: string
        label:
          type: string
        amount:
          type: integer
      required:
      - amount
      - id
      - label
      - type
      title: FeeBreakdownLine
      id: FeeBreakdownLine
    LineItem:
      discriminator:
        mapping:
          ticket: "#/components/schemas/TicketLineItem"
          physical_goods: "#/components/schemas/PhysicalGoodsLineItem"
          service: "#/components/schemas/ServiceLineItem"
          digital_goods: "#/components/schemas/DigitalGoodsLineItem"
          food_beverage: "#/components/schemas/FoodBeverageLineItem"
          donation: "#/components/schemas/DonationLineItem"
          other: "#/components/schemas/OtherLineItem"
        propertyName: category
      oneOf:
      - $ref: "#/components/schemas/TicketLineItem"
      - $ref: "#/components/schemas/PhysicalGoodsLineItem"
      - $ref: "#/components/schemas/ServiceLineItem"
      - $ref: "#/components/schemas/DigitalGoodsLineItem"
      - $ref: "#/components/schemas/FoodBeverageLineItem"
      - $ref: "#/components/schemas/DonationLineItem"
      - $ref: "#/components/schemas/OtherLineItem"
      id: LineItem
    TicketLineItem:
      example:
        parent_ref: parent_ref
        item_ref: item_ref
        quantity: 0
        image_url: https://openapi-generator.tech
        name: name
        description: description
        currency: currency
        sku: sku
        unit_price: 0
        category: ticket
        custom_data:
          venue_name: venue_name
          event_id: event_id
          venue_address:
            key: ""
          timezone: timezone
          terms_url: terms_url
          name: name
          attendee_required: true
          event_start_at: 2000-01-23T04:56:07.000+00:00
          event_end_at: 2000-01-23T04:56:07.000+00:00
          ticket_class: ticket_class
          delivery_mode: email
          seating:
            seat: seat
            allocation:
              key: ""
            section: section
            row: row
      properties:
        item_ref:
          minLength: 1
          type: string
        parent_ref:
          nullable: true
          type: string
        sku:
          nullable: true
          type: string
        name:
          minLength: 1
          type: string
        description:
          nullable: true
          type: string
        image_url:
          format: uri
          nullable: true
          type: string
        quantity:
          exclusiveMinimum: true
          minimum: 0
          type: integer
        unit_price:
          minimum: 0
          type: integer
        currency:
          pattern: "^[A-Z]{3}$"
          type: string
        category:
          enum:
          - ticket
          type: string
        custom_data:
          $ref: "#/components/schemas/TicketCustomData"
      required:
      - category
      - currency
      - custom_data
      - item_ref
      - name
      - quantity
      - unit_price
      title: TicketLineItem
      id: TicketLineItem
    TicketCustomData:
      example:
        venue_name: venue_name
        event_id: event_id
        venue_address:
          key: ""
        timezone: timezone
        terms_url: terms_url
        name: name
        attendee_required: true
        event_start_at: 2000-01-23T04:56:07.000+00:00
        event_end_at: 2000-01-23T04:56:07.000+00:00
        ticket_class: ticket_class
        delivery_mode: email
        seating:
          seat: seat
          allocation:
            key: ""
          section: section
          row: row
      properties:
        event_id:
          type: string
        event_start_at:
          format: date-time
          type: string
        timezone:
          type: string
        ticket_class:
          type: string
        name:
          type: string
        event_end_at:
          format: date-time
          type: string
        delivery_mode:
          enum:
          - email
          - sms
          - post
          - at_venue
          type: string
        venue_name:
          type: string
        venue_address:
          additionalProperties: {}
        seating:
          $ref: "#/components/schemas/TicketSeating"
        terms_url:
          type: string
        attendee_required:
          type: boolean
      required:
      - event_id
      - event_start_at
      - timezone
      id: TicketCustomData
    TicketSeating:
      example:
        seat: seat
        allocation:
          key: ""
        section: section
        row: row
      properties:
        section:
          type: string
        row:
          type: string
        seat:
          type: string
        allocation:
          additionalProperties: {}
      id: TicketSeating
    PhysicalGoodsLineItem:
      properties:
        item_ref:
          minLength: 1
          type: string
        parent_ref:
          nullable: true
          type: string
        sku:
          nullable: true
          type: string
        name:
          minLength: 1
          type: string
        description:
          nullable: true
          type: string
        image_url:
          format: uri
          nullable: true
          type: string
        quantity:
          exclusiveMinimum: true
          minimum: 0
          type: integer
        unit_price:
          minimum: 0
          type: integer
        currency:
          pattern: "^[A-Z]{3}$"
          type: string
        category:
          enum:
          - physical_goods
          type: string
        custom_data:
          $ref: "#/components/schemas/PhysicalGoodsCustomData"
      required:
      - category
      - currency
      - custom_data
      - item_ref
      - name
      - quantity
      - unit_price
      title: PhysicalGoodsLineItem
      id: PhysicalGoodsLineItem
    PhysicalGoodsCustomData:
      properties:
        product_id:
          type: string
        comments:
          type: string
      required:
      - product_id
      id: PhysicalGoodsCustomData
    ServiceLineItem:
      properties:
        item_ref:
          minLength: 1
          type: string
        parent_ref:
          nullable: true
          type: string
        sku:
          nullable: true
          type: string
        name:
          minLength: 1
          type: string
        description:
          nullable: true
          type: string
        image_url:
          format: uri
          nullable: true
          type: string
        quantity:
          exclusiveMinimum: true
          minimum: 0
          type: integer
        unit_price:
          minimum: 0
          type: integer
        currency:
          pattern: "^[A-Z]{3}$"
          type: string
        category:
          enum:
          - service
          type: string
        custom_data:
          $ref: "#/components/schemas/ServiceCustomData"
      required:
      - category
      - currency
      - item_ref
      - name
      - quantity
      - unit_price
      title: ServiceLineItem
      id: ServiceLineItem
    ServiceCustomData:
      properties:
        serviceType:
          nullable: true
          type: string
      id: ServiceCustomData
    DigitalGoodsLineItem:
      properties:
        item_ref:
          minLength: 1
          type: string
        parent_ref:
          nullable: true
          type: string
        sku:
          nullable: true
          type: string
        name:
          minLength: 1
          type: string
        description:
          nullable: true
          type: string
        image_url:
          format: uri
          nullable: true
          type: string
        quantity:
          exclusiveMinimum: true
          minimum: 0
          type: integer
        unit_price:
          minimum: 0
          type: integer
        currency:
          pattern: "^[A-Z]{3}$"
          type: string
        category:
          enum:
          - digital_goods
          type: string
